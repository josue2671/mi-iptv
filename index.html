<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi IPTV</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body {
            margin: 0;
            background: #000;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>

<body>

<video id="video" controls playsinline></video>

<script>

const video = document.getElementById("video");

const url = "https://vd717.okcdn.ru/?expires=1791235903225&srcIp=149.50.197.51&pr=10&srcAg=CHROME_ANDROID&ms=176.112.172.33&type=5&subId=19155931105822&sig=ofQwM-1uTPw&ct=0&urls=178.237.23.56&clientType=0&zs=43&id=19155931105822";

if (Hls.isSupported()) {

    const hls = new Hls();

    hls.loadSource(url);
    hls.attachMedia(video);

} else if (video.canPlayType("application/vnd.apple.mpegurl")) {

    video.src = url;

}

</script>

</body>
</html>
