<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi IPTV</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body {
            margin: 0;
            background: #000;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>

<body>

<video id="video" controls playsinline></video>

<script>

const video = document.getElementById("video");

const url = "https://archive-org.translate.goog/download/Super%20Mario%20Bros%201993%20The%20Morton%20Jankel%20Cut%20Extended%20DVD%201-1.mp4?_x_tr_sl=en&_x_tr_tl=es&_x_tr_hl=es&_x_tr_pto=tc9155931105822&sig=ofQwM-1uTPw&ct=0&urls=178.237.23.56&clientType=0&zs=43&id=19155931105822";

if (Hls.isSupported()) {

    const hls = new Hls();

    hls.loadSource(url);
    hls.attachMedia(video);

} else if (video.canPlayType("application/vnd.apple.mpegurl")) {

    video.src = url;

}

</script>

</body>
</html>
